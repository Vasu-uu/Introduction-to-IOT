<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Quiz — Introduction to Internet of Things</title>
  <meta name="description" content="Practice quizzes for the NPTEL Introduction to Internet of Things course: weekly notes quizzes and randomised weekly and full assignment quizzes." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ccircle cx='20' cy='22' r='5' fill='%23fff'/%3E%3Ccircle cx='44' cy='22' r='5' fill='%23fff'/%3E%3Ccircle cx='32' cy='44' r='5' fill='%23fff'/%3E%3Cpath d='M20 22L44 22L32 44Z' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("iot-quiz:theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="IoT Quiz home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <circle cx="9" cy="10" r="3" />
          <circle cx="23" cy="10" r="3" />
          <circle cx="16" cy="23" r="3" />
          <path d="M9 10 L23 10 L16 23 Z" fill="none" stroke-width="1.6" />
        </svg>
      </span>
      <span class="brand-text">IoT<span class="slash">/</span>Quiz</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="#/notes" data-nav="notes">Notes</a>
      <a href="#/assignments" data-nav="assignments">Assignments</a>
      <a href="#/cheatsheet" data-nav="cheatsheet">Cheat Sheet</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
    </button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer class="footer">
    <p>Built for revising NPTEL <em>Introduction to Internet of Things</em> (IIT Kharagpur). Questions are drawn only from the course notes and official assignment solutions.</p>
    <p class="footer-keys"><kbd>1</kbd>–<kbd>4</kbd> select · <kbd>Enter</kbd> check / next</p>
  </footer>

  <script src="js/notes-data.js"></script>
  <script src="js/assignment-data.js"></script>
  <script src="js/cheatsheet-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
